name: "Setup GitHub App Token"
description: "Setup a GitHub App token for one owner and a set of repositories"

inputs:
  app_id:
    required: true
    description: "GitHub App ID"
  private_key:
    required: true
    description: "GitHub App private key"
  owner:
    required: false
    description: "Owner (organization or user) of the target repositories"
    default: ""
  repositories:
    required: false
    description: "Unused – kept for documentation. Token is scoped at owner level."
    default: ""

outputs:
  token:
    description: "GitHub App token for the given owner (all repositories the App is installed on)"
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ inputs.owner }}
