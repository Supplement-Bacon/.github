name: "Setup GitHub App Token"
description: "Setup a GitHub App token for one owner and a set of repositories"

inputs:
  app_id:
    required: true
    description: "GitHub App ID"
  private_key:
    required: true
    description: "GitHub App private key"
  owner:
    required: false
    description: "Owner (organization or user) of the target repositories"
    default: ""
  repositories:
    required: false
    description: "Newline-separated list of repositories the token should have access to"
    default: ""

outputs:
  token:
    description: "GitHub App token for the given owner, optionally scoped to specific repositories"
    value: ${{ steps.app-token-scoped.outputs.token || steps.app-token-owner.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate scoped GitHub App token
      if: ${{ inputs.repositories != '' }}
      id: app-token-scoped
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ inputs.owner }}
        repositories: ${{ inputs.repositories }}

    - name: Generate owner GitHub App token
      if: ${{ inputs.repositories == '' }}
      id: app-token-owner
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}
        owner: ${{ inputs.owner }}
