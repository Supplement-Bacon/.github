name: SonarQube

on:
  workflow_call:
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Download PR coverage report
        uses: actions/download-artifact@v7
        with:
          name: coverage-pr
          path: .
        continue-on-error: true

      - name: Download base coverage report
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v7
        with:
          name: coverage-base
          path: ./artifacts/coverage-base
        continue-on-error: true

      - name: Fallback — empty coverage files if missing
        run: |
          if [ ! -f coverage.xml ]; then
            echo '<?xml version="1.0"?><coverage><project><metrics statements="0" coveredstatements="0"/></project></coverage>' > coverage.xml
          fi
          mkdir -p ./artifacts/coverage-base
          if [ ! -f ./artifacts/coverage-base/coverage-base.xml ]; then
            echo '<?xml version="1.0"?><coverage><project><metrics statements="0" coveredstatements="0"/></project></coverage>' > ./artifacts/coverage-base/coverage-base.xml
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.verbose=true
            -Dsonar.php.coverage.reportPaths=coverage.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Compute coverage & build comment
        if: github.event_name == 'pull_request'
        id: build-comment
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY_FALLBACK: "${{ github.repository_owner }}_${{ github.event.repository.name }}"
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # The project key is whatever sonar-project.properties declares, because
          # that is what SonarCloud stores and it does NOT follow a repository
          # rename. Deriving it from the repo name meant that the first rename
          # would silently point the queries below at a project that does not
          # exist: the API returns nothing, the comment reads 0 bugs and 0
          # vulnerabilities, and the report link 404s. Green, and wrong.
          # The repo-name form stays as a fallback for repos without the file.
          SONAR_PROJECT_KEY="$(sed -n 's/^[[:space:]]*sonar\.projectKey[[:space:]]*=[[:space:]]*//p' \
            sonar-project.properties 2>/dev/null | head -1 | tr -d '[:space:]')"
          SONAR_PROJECT_KEY="${SONAR_PROJECT_KEY:-$SONAR_PROJECT_KEY_FALLBACK}"
          echo "SonarCloud project key: $SONAR_PROJECT_KEY"

          # ── Parser Clover → JSON ──────────────────────────────────
          cat > /tmp/parse_clover.py << 'PYEOF'
          import sys, json, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
              m = root.find('project/metrics')
              if m is None:
                  all_m = root.findall('.//metrics')
                  m = all_m[-1] if all_m else None
              if m is None:
                  print('{"pct":0,"stmts":0,"hits":0,"misses":0,"files":0}')
                  sys.exit(0)
              stmts   = int(m.get('statements', 0))
              covered = int(m.get('coveredstatements', 0))
              files   = int(m.get('files', 0))
              pct     = round(covered / stmts * 100, 2) if stmts > 0 else 0.0
              print(json.dumps({"pct": pct, "stmts": stmts, "hits": covered,
                                "misses": stmts - covered, "files": files}))
          except Exception as e:
              print(f"ERREUR: {e}", file=sys.stderr)
              print('{"pct":0,"stmts":0,"hits":0,"misses":0,"files":0}')
          PYEOF

          pr_json=$(python3   /tmp/parse_clover.py ./coverage.xml)
          base_json=$(python3 /tmp/parse_clover.py ./artifacts/coverage-base/coverage-base.xml)

          pr_pct=$(echo "$pr_json"     | jq -r '.pct')
          pr_stmts=$(echo "$pr_json"   | jq -r '.stmts')
          pr_hits=$(echo "$pr_json"    | jq -r '.hits')
          pr_misses=$(echo "$pr_json"  | jq -r '.misses')
          pr_files=$(echo "$pr_json"   | jq -r '.files')

          base_pct=$(echo "$base_json"    | jq -r '.pct')
          base_stmts=$(echo "$base_json"  | jq -r '.stmts')
          base_hits=$(echo "$base_json"   | jq -r '.hits')
          base_misses=$(echo "$base_json" | jq -r '.misses')
          base_files=$(echo "$base_json"  | jq -r '.files')

          # ── Diffs ─────────────────────────────────────────────────
          diff_pct=$(awk -v p="$pr_pct" -v b="$base_pct" 'BEGIN{printf "%+.2f%%", p-b}')
          diff_stmts=$(( pr_stmts  - base_stmts  ))
          diff_hits=$(( pr_hits    - base_hits    ))
          diff_misses=$(( pr_misses - base_misses ))
          diff_files=$(( pr_files   - base_files  ))
          fmt(){ [ "$1" -ge 0 ] && echo "+$1" || echo "$1"; }
          diff_stmts_str=$(fmt $diff_stmts)
          diff_hits_str=$(fmt $diff_hits)
          diff_misses_str=$(fmt $diff_misses)
          diff_files_str=$(fmt $diff_files)

          # ── Trend, colours and diff indicators ───────────────────
          if awk -v p="$pr_pct" -v b="$base_pct" 'BEGIN{exit !(p+0 > b+0)}'; then
            trend="increase"; trend_icon="⬆️"; cov_sign="+"
          elif awk -v p="$pr_pct" -v b="$base_pct" 'BEGIN{exit !(p+0 < b+0)}'; then
            trend="decrease"; trend_icon="⬇️"; cov_sign="-"
          else
            trend="no change"; trend_icon="➡️"; cov_sign=" "
          fi
          hits_sign=$([ $pr_hits -ge $base_hits ] && echo "+" || echo "-")
          misses_sign=$([ $pr_misses -le $base_misses ] && echo "+" || echo "-")

          # ── SonarCloud quality metrics (PR branch) ───────────────
          resp=$(curl -s -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/measures/component?component=${SONAR_PROJECT_KEY}&branch=${PR_BRANCH}&metricKeys=duplicated_lines_density,bugs,vulnerabilities,code_smells") || true

          pr_duplicates=$(echo "$resp" | jq -r '.component.measures[] | select(.metric=="duplicated_lines_density") | .value // "0"' 2>/dev/null || echo "0")
          pr_bugs=$(echo "$resp"       | jq -r '.component.measures[] | select(.metric=="bugs")                    | .value // "0"' 2>/dev/null || echo "0")
          pr_vulns=$(echo "$resp"      | jq -r '.component.measures[] | select(.metric=="vulnerabilities")         | .value // "0"' 2>/dev/null || echo "0")
          pr_smells=$(echo "$resp"     | jq -r '.component.measures[] | select(.metric=="code_smells")             | .value // "0"' 2>/dev/null || echo "0")

          bugs_icon=$([ "$pr_bugs"  = "0" ] && echo "✅" || echo "🐛")
          vulns_icon=$([ "$pr_vulns" = "0" ] && echo "✅" || echo "⚠️")
          smells_icon=$(awk -v s="$pr_smells"     'BEGIN{print (s+0 < 10 ? "✅" : "💡")}')
          dup_icon=$(awk    -v d="$pr_duplicates" 'BEGIN{print (d+0 < 3  ? "✅" : (d+0 < 10 ? "💡" : "⚠️"))}')

          # ── Output ───────────────────────────────────────────────
          DELIMITER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "comment_body<<$DELIMITER" >> "$GITHUB_OUTPUT"
          cat <<EOF >> "$GITHUB_OUTPUT"
          <!-- sonarcloud-coverage-report -->
          ## Coverage Report

          > Merging \`${PR_BRANCH}\` into \`${BASE_BRANCH}\` will **${trend}** coverage by \`${diff_pct}\` ${trend_icon}

          \`\`\`diff
          @@           Coverage     Diff   @@
          ##           ${BASE_BRANCH}    ${PR_BRANCH}    +/-
          ==========================================
          ${cov_sign} Coverage   ${base_pct}%    ${pr_pct}%    ${diff_pct}
            Files      ${base_files}             ${pr_files}    ${diff_files_str}
            Lines      ${base_stmts}             ${pr_stmts}    ${diff_stmts_str}
          ==========================================
          ${hits_sign} Hits       ${base_hits}             ${pr_hits}    ${diff_hits_str}
          ${misses_sign} Misses     ${base_misses}             ${pr_misses}    ${diff_misses_str}
          \`\`\`

          <details>
          <summary>📋 Quality details — SonarCloud</summary>

          | | Value |
          |---|---|
          | 🐛 Bugs | \`$pr_bugs\` $bugs_icon |
          | 🔒 Vulnerabilities | \`$pr_vulns\` $vulns_icon |
          | 🌀 Code Smells | \`$pr_smells\` $smells_icon |
          | 📋 Duplications | \`$pr_duplicates%\` $dup_icon |

          </details>

          [🔍 Full report on SonarCloud →](https://sonarcloud.io/project/overview?id=$SONAR_PROJECT_KEY)
          EOF
          echo "$DELIMITER" >> "$GITHUB_OUTPUT"

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          mode: upsert
          comment-tag: "sonarcloud-coverage-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ steps.build-comment.outputs.comment_body }}
