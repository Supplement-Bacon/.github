# Versioning and release for the organization's shared CI.
#
# release-please reads the Conventional Commits landed on main and maintains an
# open "Release PR" carrying the next version and its changelog. Merging that
# pull request is the release: it creates an immutable vX.Y.Z tag and publishes
# the GitHub Release.
#
# Two kinds of tag, governed by two org rulesets:
#   vX.Y.Z  immutable  - created here, then never moved or deleted by anyone
#                        (plethore-shared-ci-release-tags, no bypass actors)
#   vX      pointer    - repointed at the newest vX.Y.Z, by an organization
#                        owner (plethore-shared-ci-tags)
#
# The pointer move is deliberately manual. A workflow does not run as a person:
# it runs as the GitHub Actions app, which GitHub refuses as a ruleset bypass
# actor, so automating it would mean storing a personal token or registering a
# GitHub App. This job prints the exact commands in the run summary instead.
#
# Consumers pin @v3 to follow patches and minors, or an exact @v3.Y.Z where the
# call reaches production. A major is never adopted by anyone automatically.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Tell the owner which pointer to move
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          MAJOR: v${{ steps.release.outputs.major }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          # Until the pointer is moved, every consumer on @vX is still running
          # the previous release. That is intentional: nothing reaches the 17
          # repositories without a person deciding it should.
          {
            echo "## ${TAG} released"
            echo
            echo "Consumers pinned to \`${MAJOR}\` are still on the previous release."
            echo "An organization owner repoints the major tag:"
            echo
            echo '```sh'
            echo "git fetch origin --tags"
            echo "git tag -f ${MAJOR} ${SHA}"
            echo "git push origin ${MAJOR} --force"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Pointer not moved::${TAG} is released; ${MAJOR} still points at the previous release until an owner moves it"
