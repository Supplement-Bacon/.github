name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      client:
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: forge-deploy-${{ inputs.client != '' && inputs.client || 'default' }}-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Install Forge CLI
        run: composer global require laravel/forge-cli

      - name: Switch organization
        run: forge organization:switch ${{ secrets.FORGE_ORGANIZATION }}

      - name: Switch server
        run: forge server:switch ${{ inputs.client != '' && secrets[format('{0}_SERVER_ID', inputs.client)] || secrets.SERVER_ID }}

      - name: Deploy
        run: forge deploy ${{ inputs.client != '' && secrets[format('{0}_DOMAIN', inputs.client)] || secrets.DOMAIN }}
