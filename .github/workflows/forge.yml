name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      FORGE_API_TOKEN:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      SSH_KNOWN_HOSTS:
        required: true

permissions:
  contents: read

concurrency:
  group: forge-deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: none

      - name: Install Forge CLI
        run: composer global require laravel/forge-cli

      - name: Deploy
        run: forge deploy ${{ vars.DOMAIN }} --wait
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
