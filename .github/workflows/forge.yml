name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      DOMAIN:
        required: true

permissions:
  contents: read

concurrency:
  group: forge-deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Get site_id from domain
        id: get-site-id
        run: |
          site_id=$(curl -sS -H "Authorization: Bearer ${FORGE_API_TOKEN}" \
            "https://forge.laravel.com/api/v1/servers" | \
            jq -r ".servers[] | select(.name | contains(\"${{ inputs.DOMAIN }}\")) | .id")
          echo "site_id=${site_id}" >> $GITHUB_OUTPUT
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}

      - name: Trigger deploy via Forge API
        run: |
          curl -sS -X POST "https://forge.laravel.com/api/v1/sites/${{ steps.get-site-id.outputs.site_id }}/deployment/deploy" \
            -H "Authorization: Bearer ${FORGE_API_TOKEN}" \
            -H "Accept: application/json"
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
