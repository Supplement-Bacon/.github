name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      client:
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type deploy to run production deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forge-deploy-${{ github.event_name == 'workflow_call' && inputs.environment || 'production' }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_call' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && github.event.inputs.confirmation == 'deploy')
    environment: ${{ github.event_name == 'workflow_call' && inputs.environment || 'production' }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          coverage: none

      - name: Install Forge CLI
        run: composer global require laravel/forge-cli

      - name: Deploy
        run: |
          forge server:switch ${{ inputs.client != '' && secrets[format('{0}_SERVER_ID', inputs.client)] || secrets.SERVER_ID }}
          forge deploy ${{ inputs.client != '' && secrets[format('{0}_SITE_ID', inputs.client)] || secrets.SITE_ID }}
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
