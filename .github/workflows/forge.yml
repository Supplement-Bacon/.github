name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      site_id:
        required: true
        type: string
    secrets:
      FORGE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: forge-deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Trigger deploy via Forge API
        run: |
          set -euo pipefail

          response=$(curl -sS -w "\n%{http_code}" -X POST "https://forge.laravel.com/api/v1/sites/${{ inputs.site_id }}/deployment/deploy" \
            -H "Authorization: Bearer ${FORGE_API_TOKEN}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json")
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
