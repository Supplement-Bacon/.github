name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      client:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: forge-deploy-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  forge:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer:v2
          coverage: none

      - name: Install Forge CLI
        run: composer global require laravel/forge-cli

      - name: Deploy
        run: |
          forge server:switch ${{ secrets.SERVER_ID }}
          forge deploy ${{ secrets[format('{0}_SITE_ID', inputs.client)] }}
        env:
          FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
