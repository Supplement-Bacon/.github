name: PHPUnit

on:
  workflow_call:
    inputs:
      composer_repositories:
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: "--parallel --processes=4 --colors=never"
      run-example-tests:
        required: false
        type: boolean
        default: false
      # Deprecated, no effect: the base-branch coverage job it toggled only fed
      # SonarQube and was removed. Kept so callers still passing it don't break.
      run-phpunit-coverage:
        required: false
        type: boolean
        default: false
        description: "Deprecated, no effect"
      package:
        required: false
        type: boolean
        default: false
        description: "Set to true for Composer packages (Testbench): skips the Laravel env setup and runs vendor/bin/testbench package:test instead of php artisan test"
      pcov_directory:
        required: false
        type: string
        default: "app"
        description: "Directory pcov should instrument (e.g. src for packages)"
      extra_owner:
        required: false
        type: string
        default: ""
      extra_repositories:
        required: false
        type: string
        default: ""
      runner:
        required: false
        type: string
        default: "ubuntu-latest"
        description: "Runner label of the test job, e.g. an organization larger runner (more cores make --parallel worth it)"

permissions:
  contents: read
  actions: write

jobs:
  phpunit:
    if: inputs.run-example-tests != true
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP & Composer
        uses: Supplement-Bacon/.github/.github/actions/setup-php-and-dependencies@v4
        with:
          app_id: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_ID }}
          private_key: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.composer_repositories }}
          coverage: pcov
          pcov_directory: ${{ inputs.pcov_directory }}
          extra_owner: ${{ inputs.extra_owner }}
          extra_repositories: ${{ inputs.extra_repositories }}

      - name: Setup Laravel environment
        run: |
          if [ "${{ inputs.package }}" = "true" ]; then
            # Package (Testbench) : un .env vide suffit — évite les warnings Dotenv par test
            [ -f .env ] || touch .env
          else
            cp .env.example .env
            php artisan key:generate
          fi

      - name: Run tests with coverage
        run: |
          set -o pipefail
          # An array, not a string: these are several CLI flags and must reach
          # the test runner as separate arguments. Quoting a plain string would
          # pass them as one argument; leaving it unquoted would also glob.
          # Apps keep --parallel: paratest merges each worker's pcov coverage
          # into the same clover report as a sequential run. Packages
          # (Testbench) still run sequentially, their parallel coverage being
          # unverified.
          if [ "${{ inputs.package }}" = "true" ]; then
            read -r -a COVERAGE_ARGS <<< "$(echo "${{ inputs.test-args }}" | sed -E 's/--parallel[[:space:]]*//g; s/--processes=[0-9]+[[:space:]]*//g')"
          else
            read -r -a COVERAGE_ARGS <<< "${{ inputs.test-args }}"
          fi
          if [ "${{ inputs.package }}" = "true" ]; then
            vendor/bin/testbench package:test "${COVERAGE_ARGS[@]}" --coverage-clover=coverage.xml --log-junit=junit.xml
          else
            php artisan test "${COVERAGE_ARGS[@]}" --coverage-clover=coverage.xml --log-junit=junit.xml
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr
          path: coverage.xml
          retention-days: 1

      # Datadog Test Optimization has no native PHP library: it ingests the
      # PHPUnit JUnit report instead (per-test results, durations, flaky test
      # detection). Runs on failure too, when the results matter most, and can
      # never fail the job: `test / phpunit` is a required check org-wide.
      # Only the upload step receives DD_API_KEY, not composer scripts or the
      # tests. Without the secret the upload is skipped.
      - name: Check for the Datadog key
        id: datadog
        if: always()
        run: echo "enabled=${{ secrets.DD_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload test results to Datadog
        if: always() && steps.datadog.outputs.enabled == 'true' && hashFiles('junit.xml') != ''
        continue-on-error: true
        uses: DataDog/junit-upload-github-action@cdbf0b0acda1005e45c4a11d445bf3dde78e796f # v4.1.0
        env:
          # On pull_request events GITHUB_SHA is the synthetic merge commit,
          # which Datadog cannot match to the pull request. Report the head.
          DD_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DD_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
        with:
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu
          files: junit.xml
          auto-discovery: "false"
          service: ${{ github.event.repository.name }}
          env: ci
