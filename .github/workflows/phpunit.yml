name: PHPUnit

on:
  workflow_call:
    inputs:
      composer_repositories:
        required: false
        type: string
        default: ""
      test-args:
        required: false
        type: string
        default: "--parallel --processes=4 --colors=never"
      run-example-tests:
        required: false
        type: boolean
        default: false
      run-phpunit-coverage:
        required: false
        type: boolean
        default: true
      package:
        required: false
        type: boolean
        default: false
        description: "Set to true for Composer packages (Testbench): skips the Laravel env setup and runs vendor/bin/testbench package:test instead of php artisan test"
      pcov_directory:
        required: false
        type: string
        default: "app"
        description: "Directory pcov should instrument (e.g. src for packages)"
      extra_owner:
        required: false
        type: string
        default: ""
      extra_repositories:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  actions: write

jobs:
  phpunit:
    if: inputs.run-example-tests != true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP & Composer
        uses: Supplement-Bacon/.github/.github/actions/setup-php-and-dependencies@v3
        with:
          app_id: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_ID }}
          private_key: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.composer_repositories }}
          coverage: pcov
          pcov_directory: ${{ inputs.pcov_directory }}
          extra_owner: ${{ inputs.extra_owner }}
          extra_repositories: ${{ inputs.extra_repositories }}

      - name: Setup Laravel environment
        if: inputs.package != true
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests with coverage
        run: |
          set -o pipefail
          COVERAGE_ARGS=$(echo "${{ inputs.test-args }}" | sed -E 's/--parallel[[:space:]]*//g; s/--processes=[0-9]+[[:space:]]*//g')
          if [ "${{ inputs.package }}" = "true" ]; then
            vendor/bin/testbench package:test $COVERAGE_ARGS --coverage-clover=coverage.xml
          else
            php artisan test $COVERAGE_ARGS --coverage-clover=coverage.xml
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-pr
          path: coverage.xml
          retention-days: 1

  phpunit-coverage:
    if: github.event_name == 'pull_request' && inputs.run-example-tests != true && inputs.run-phpunit-coverage == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup PHP & Composer
        uses: Supplement-Bacon/.github/.github/actions/setup-php-and-dependencies@v3
        with:
          app_id: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_ID }}
          private_key: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          repositories: ${{ inputs.composer_repositories }}
          coverage: pcov
          pcov_directory: ${{ inputs.pcov_directory }}
          extra_owner: ${{ inputs.extra_owner }}
          extra_repositories: ${{ inputs.extra_repositories }}

      - name: Setup Laravel environment
        if: inputs.package != true
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests with coverage on base branch
        continue-on-error: true
        run: |
          set -o pipefail
          COVERAGE_ARGS=$(echo "${{ inputs.test-args }}" | sed -E 's/--parallel[[:space:]]*//g; s/--processes=[0-9]+[[:space:]]*//g')
          if [ "${{ inputs.package }}" = "true" ]; then
            vendor/bin/testbench package:test $COVERAGE_ARGS --coverage-clover=coverage-base.xml
          else
            php artisan test $COVERAGE_ARGS --coverage-clover=coverage-base.xml
          fi

      - name: Fallback — empty coverage file if tests crashed
        if: always()
        run: |
          if [ ! -f coverage-base.xml ]; then
            echo '<?xml version="1.0"?><coverage><project><metrics statements="0" coveredstatements="0"/></project></coverage>' > coverage-base.xml
          fi

      - name: Upload base coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-base
          path: coverage-base.xml
          retention-days: 1
