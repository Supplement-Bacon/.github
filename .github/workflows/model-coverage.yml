name: Coverage

on:
  workflow_call:
    inputs:
      repository:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  factory-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@feat/ci-back
        with:
          app-id: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_ID }}
          private-key: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup PHP & Composer
        uses: Supplement-Bacon/.github/.github/actions/php@feat/ci-back
        with:
          app_id: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_ID }}
          private_key: ${{ secrets.BACKEND_CI_DEPENDENCIES_APP_PRIVATE_KEY }}

      - name: Run Factory Coverage command
        id: factory_coverage
        continue-on-error: true
        run: |
          php vendor/bin/testbench model:factory-coverage --markdown > factory-coverage.txt

          echo "coverage<<EOF" >> $GITHUB_OUTPUT
          cat factory-coverage.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          mode: upsert
          comment-tag: "model-factory-coverage"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          message: |
            ## 🧪 Model / Factory Coverage

            ${{ steps.factory_coverage.outputs.coverage }}
